packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

catalog:
  zod: '4.6.7'

# Require all package releases to age for five days before they are eligible.
minimumReleaseAge: 7200

allowBuilds:
  '@badeball/cypress-cucumber-preprocessor': false
  cypress: true
  '@parcel/watcher': false
  '@sentry/cli': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true
  '@sentry/node-cpu-profiler': true
