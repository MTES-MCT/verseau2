packages:
  - '.'

# pnpm 12 defaults to a one-day release quarantine. Only the exact upgraded
# version below is exempted; all future releases keep the default policy.
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1133.0'

allowBuilds:
  '@matrix-org/matrix-sdk-crypto-nodejs': true
  cpu-features: false
  protobufjs: false
  ssh2: false
