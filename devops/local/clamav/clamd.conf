# clamd local pour le scanner antivirus (apps/antivirus).
# La section « Politique scanner » reprend exactement la policy de
# apps/antivirus/scripts/configure-clamd.mjs : garder les deux en sync.
# Pas de TCPSocket : le scanner se connecte uniquement au socket Unix
# (CLAMD_SOCKET_PATH), partagé aux autres conteneurs via le volume
# verseau2-clamav-socket monté ici dans /tmp.

DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
Foreground yes
User clamav

# Politique scanner (cf. configure-clamd.mjs)
StreamMaxLength 73400320
MaxFileSize 73400320
MaxScanSize 73400320
MaxRecursion 10
MaxFiles 1000
MaxScanTime 90000
AlertExceedsMax yes
AlertEncrypted yes
MaxThreads 1
MaxQueue 1
ReadTimeout 120
CommandReadTimeout 5
SendBufTimeout 5000
DisableCache yes
LeaveTemporaryFiles no
LogFile /dev/null
LogFileUnlock yes
LogSyslog no
LogVerbose no
LogClean no
Debug no
