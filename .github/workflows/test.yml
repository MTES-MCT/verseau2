name: Build and Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_changes: ${{ steps.matrix.outputs.has_changes }}
      workspaces: ${{ steps.matrix.outputs.workspaces }}
      run_e2e: ${{ steps.filter.outputs.all == 'true' || steps.filter.outputs.front == 'true' || steps.filter.outputs.back == 'true' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4.0.1
        with:
          filters: |
            all:
              - '.github/workflows/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '**/package.json'
              - 'packages/dossier/**'
              - 'packages/parser/**'
              - 'packages/shared/**'
            front:
              - 'apps/front/**'
            back:
              - 'apps/back/**'
            e2e:
              - 'e2e/**'

      - name: Select workspaces to test
        id: matrix
        run: |
          workspaces=()

          if [[ "${{ steps.filter.outputs.all }}" == "true" ]]; then
            workspaces=(front back parser dossier)
          else
            if [[ "${{ steps.filter.outputs.front }}" == "true" ]]; then
              workspaces+=(front)
            fi

            if [[ "${{ steps.filter.outputs.back }}" == "true" ]]; then
              workspaces+=(back)
            fi
          fi

          if [[ ${#workspaces[@]} -eq 0 ]]; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            echo 'workspaces=["noop"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json="["
          for workspace in "${workspaces[@]}"; do
            if [[ "$json" != "[" ]]; then
              json+=","
            fi
            json+="\"$workspace\""
          done
          json+="]"

          echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          echo "workspaces=$json" >> "$GITHUB_OUTPUT"

  build-and-tests:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: ${{ fromJson(needs.changes.outputs.workspaces) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.workspace }}
        run: pnpm --filter ${{ matrix.workspace }} run --if-present build

      - name: Run backend tests
        if: matrix.workspace == 'back'
        run: pnpm --filter back run --if-present test:ci

      - name: Run tests
        if: matrix.workspace != 'back'
        run: pnpm --filter ${{ matrix.workspace }} run --if-present test

  browser-e2e:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install Cypress Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libgbm1 libnotify4 libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cypress and Docker
        run: |
          pnpm --filter e2e exec cypress verify
          docker info --format '{{.ServerVersion}}'

      - name: Run browser E2E tests
        run: pnpm test:e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7
