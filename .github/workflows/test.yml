name: Build and Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [front, back, parser, dossier]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.workspace }}
        run: pnpm --filter ${{ matrix.workspace }} run --if-present build

      - name: Run backend tests
        if: matrix.workspace == 'back'
        run: pnpm --filter back run --if-present test:ci

      - name: Run tests
        if: matrix.workspace != 'back'
        run: pnpm --filter ${{ matrix.workspace }} run --if-present test
